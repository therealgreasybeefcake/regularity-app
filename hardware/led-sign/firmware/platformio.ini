; Regularity LED sign firmware.
; Build & flash:  pio run -e matrixportal_s3 -t upload      Serial log:  pio device monitor
; Board/panel presets live in src/config.h; the extra envs below just pick a
; different chip and board preset (override SIGN_PANEL the same way if needed).

[env]
; espressif32 6.10.0 = Arduino-ESP32 core 2.0.17 (the version this was built against)
platform = espressif32@6.10.0
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
    adafruit/Adafruit GFX Library@1.12.1
    https://github.com/mrcodetastic/ESP32-HUB75-MatrixPanel-DMA.git#3.0.14
    h2zero/NimBLE-Arduino@2.3.0
; The HUB75 library's panel mapping uses C++17 `if constexpr`.
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=2

; Recommended: Adafruit MatrixPortal S3 plugged straight onto the panel.
[env:matrixportal_s3]
board = adafruit_matrixportal_esp32s3

; One panel on the bench: the whole system, just smaller (32 x 16 px, ~140 mm digits).
[env:matrixportal_s3_single]
board = adafruit_matrixportal_esp32s3
build_flags = ${env.build_flags} -DGRID_COLS=1 -DGRID_ROWS=1 -DGRID_CHAIN=CHAIN_NONE

; Any ESP32-S3 dev board wired to the HUB75 library's default S3 pins.
[env:esp32s3_generic]
board = esp32-s3-devkitc-1
build_flags = ${env.build_flags} -DSIGN_BOARD=BOARD_LIBRARY_DEFAULT

; Classic ESP32 (ESP32 Trinity, ESP32-DevKit + HUB75 shield) on the library's default pins.
[env:esp32_generic]
board = esp32dev
build_flags = ${env.build_flags} -DSIGN_BOARD=BOARD_LIBRARY_DEFAULT
